services:
  mongodb:
    image: mongo:latest
    container_name: imovplan_mongodb
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:-admin123}
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: imovplan_backend
    ports:
      - "5179:8080"
    env_file:
      - ./.env
    environment:
      - Jwt__Key=${JWT_SECRET:?JWT_SECRET is required}
      - Jwt__Issuer=ImovPlanAPI
      - Jwt__Audience=ImovPlanClient
      - MongoDbSettings__ConnectionString=mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD:-admin123}@mongodb:27017/?authSource=admin
    volumes:
      - data_protection_keys:/root/.aspnet/DataProtection-Keys
    depends_on:
      - mongodb
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: imovplan_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5179/api
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongodb_data:
  data_protection_keys:
