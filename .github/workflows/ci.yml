name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'
        
    - name: Restore dependencies
      run: dotnet restore backend/Tests/ImovPlan.Application.Tests/ImovPlan.Application.Tests.csproj
      
    - name: Test backend
      run: dotnet test backend/Tests/ImovPlan.Application.Tests/ImovPlan.Application.Tests.csproj --configuration Release --no-restore

    - name: Audit dependencies
      run: dotnet list backend/Presentation/ImovPlan.API/ImovPlan.API.csproj package --vulnerable

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'frontend/package-lock.json'
        
    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Audit dependencies
      working-directory: ./frontend
      run: npm audit --audit-level=high || true
      
    - name: Lint
      working-directory: ./frontend
      run: npm run lint
      
    - name: Test
      working-directory: ./frontend
      run: npm run test
      
    - name: Build
      working-directory: ./frontend
      run: npm run build
