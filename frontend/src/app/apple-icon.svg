<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D16330"/>
      <stop offset="100%" stop-color="#D4873A"/>
    </linearGradient>
    <linearGradient id="building" x1="55" y1="35" x2="125" y2="145" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F5E6D8"/>
    </linearGradient>
  </defs>
  <!-- Rounded background -->
  <rect width="180" height="180" rx="40" fill="url(#bg)"/>
  <!-- Building body -->
  <rect x="50" y="38" width="80" height="108" rx="8" fill="url(#building)"/>
  <!-- Windows row 1 -->
  <rect x="62" y="54" width="18" height="14" rx="3" fill="#D16330" opacity="0.6"/>
  <rect x="100" y="54" width="18" height="14" rx="3" fill="#D16330" opacity="0.6"/>
  <!-- Windows row 2 -->
  <rect x="62" y="78" width="18" height="14" rx="3" fill="#D16330" opacity="0.45"/>
  <rect x="100" y="78" width="18" height="14" rx="3" fill="#D16330" opacity="0.45"/>
  <!-- Windows row 3 -->
  <rect x="62" y="102" width="18" height="14" rx="3" fill="#D16330" opacity="0.3"/>
  <rect x="100" y="102" width="18" height="14" rx="3" fill="#D16330" opacity="0.3"/>
  <!-- Door -->
  <rect x="78" y="124" width="24" height="22" rx="4" fill="#172037"/>
  <!-- Dot accent on top -->
  <circle cx="90" cy="28" r="7" fill="#FFFFFF" opacity="0.9"/>
</svg>
