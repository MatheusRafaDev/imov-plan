<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D16330"/>
      <stop offset="100%" stop-color="#D4873A"/>
    </linearGradient>
    <linearGradient id="building" x1="20" y1="12" x2="44" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F5E6D8"/>
    </linearGradient>
  </defs>
  <!-- Rounded background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Building body -->
  <rect x="18" y="14" width="28" height="38" rx="3" fill="url(#building)"/>
  <!-- Windows row 1 -->
  <rect x="23" y="20" width="6" height="5" rx="1" fill="#D16330" opacity="0.6"/>
  <rect x="35" y="20" width="6" height="5" rx="1" fill="#D16330" opacity="0.6"/>
  <!-- Windows row 2 -->
  <rect x="23" y="29" width="6" height="5" rx="1" fill="#D16330" opacity="0.45"/>
  <rect x="35" y="29" width="6" height="5" rx="1" fill="#D16330" opacity="0.45"/>
  <!-- Windows row 3 -->
  <rect x="23" y="38" width="6" height="5" rx="1" fill="#D16330" opacity="0.3"/>
  <rect x="35" y="38" width="6" height="5" rx="1" fill="#D16330" opacity="0.3"/>
  <!-- Door -->
  <rect x="28" y="44" width="8" height="8" rx="1.5" fill="#172037"/>
  <!-- Dot accent on top -->
  <circle cx="32" cy="10" r="2.5" fill="#FFFFFF" opacity="0.9"/>
</svg>
