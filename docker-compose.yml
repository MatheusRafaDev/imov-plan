services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: imovplan_backend
    ports:
      - "5179:8080"
    env_file:
      - ${ENV_FILE:-./backend/.env}
    environment:
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - JWT_ISSUER=ImovPlanAPI
      - JWT_AUDIENCE=ImovPlanClient
      - MONGO_CONNECTION_STRING=${MONGO_CONNECTION_STRING}
      - MONGO_DATABASE_NAME=${MONGO_DATABASE_NAME}
    volumes:
      - ./version.txt:/app/version.txt:ro
      - ./deploy.log:/app/deploy.log:ro
      - data_protection_keys:/root/.aspnet/DataProtection-Keys
    mem_limit: 350m
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${API_URL:-http://localhost:5179/api}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
    container_name: imovplan_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${API_URL:-http://localhost:5179/api}
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  data_protection_keys:
