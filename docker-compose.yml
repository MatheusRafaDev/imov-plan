version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: imovplan_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: imovplan_backend
    ports:
      - "5179:8080"
    env_file:
      - ./backend/.env
    environment:
      - Jwt__Key=${JWT_SECRET:?JWT_SECRET is required}
      - Jwt__Issuer=ImovPlanAPI
      - Jwt__Audience=ImovPlanClient
    depends_on:
      - mongodb
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: imovplan_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5179/api
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongodb_data:
